name = "eval-api"
main = "src/index.ts"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

# Created on the GmBodhi account (81c188cf...), the SAME account as the startathon database.
# A Worker cannot bind D1 databases across accounts, which is why both live here.
[[d1_databases]]
binding = "DB"
database_name = "eval-db"
database_id = "54bd6fda-8051-459b-afb3-2630ce7792e7"
migrations_dir = "migrations"

# The startathon event database, owned by scc-api-worker. READ-ONLY from this Worker:
# `startathon_applications` is the submissions table, joined to `startathon_teams` for the
# team name. Never written to from here -- that system owns the data.
#
# Bound by id rather than name on purpose: two different accounts each have a database called
# `scc_treasure_hunt_registrations`, and binding by name would silently pick the wrong one.
# This id is the one scc-api-worker's wrangler.jsonc binds as EVENTS_DB.
[[d1_databases]]
binding = "EVENTS_DB"
database_name = "scc_treasure_hunt_registrations"
database_id = "2e8ed049-6348-4400-9ff5-a64e447fbe3d"

[vars]
APP_NAME = "Startathon Evaluation Platform"
ENVIRONMENT = "development"
ACCESS_TOKEN_EXPIRE_MINUTES = "10080"
ADMIN_EMAIL = "admin@example.com"
ADMIN_FULL_NAME = "Administrator"
OTP_LENGTH = "6"
OTP_TTL_MINUTES = "10"
OTP_MAX_ATTEMPTS = "5"
OTP_RESEND_COOLDOWN_SECONDS = "60"
OTP_MAX_REQUESTS_PER_HOUR = "5"
BREVO_FROM_EMAIL = "noreply@sctcoding.club"
BREVO_FROM_NAME = "Startathon Evaluation Platform"
CORS_ORIGINS = '["http://localhost:5173","http://127.0.0.1:5173"]'

# Secrets are never stored here. Set them with `wrangler secret put <NAME>`, and for local
# development put them in workers/.dev.vars (gitignored):
#   JWT_SECRET_KEY  - HS256 signing key for access tokens
#   OTP_PEPPER      - server-side key for the HMAC-SHA256 passcode hash
#   BREVO_API_KEY   - Brevo transactional email API key; unset means dev passcode echo

[env.production.vars]
APP_NAME = "Startathon Evaluation Platform"
ENVIRONMENT = "production"
ACCESS_TOKEN_EXPIRE_MINUTES = "10080"
ADMIN_EMAIL = "zakuzzdj@gmail.com"
ADMIN_FULL_NAME = "Gm"
OTP_LENGTH = "6"
OTP_TTL_MINUTES = "10"
OTP_MAX_ATTEMPTS = "5"
OTP_RESEND_COOLDOWN_SECONDS = "60"
OTP_MAX_REQUESTS_PER_HOUR = "5"
BREVO_FROM_EMAIL = "noreply@sctcoding.club"
BREVO_FROM_NAME = "Startathon Evaluation Platform"
CORS_ORIGINS = '["http://localhost:5173","https://startathon-eval.pages.dev","https://*.startathon-eval.pages.dev"]'

# Named environments do NOT inherit top-level bindings, so the two databases must be
# repeated here. Without this block `wrangler deploy --env production` ships a Worker with
# no D1 at all and every request fails at runtime.
[[env.production.d1_databases]]
binding = "DB"
database_name = "eval-db"
database_id = "54bd6fda-8051-459b-afb3-2630ce7792e7"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "EVENTS_DB"
database_name = "scc_treasure_hunt_registrations"
database_id = "2e8ed049-6348-4400-9ff5-a64e447fbe3d"

[env.production.observability]
enabled = true
